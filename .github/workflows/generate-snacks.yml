name: Generate Expo Snacks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-snacks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Snacks and update README
        run: node scripts/generate-snacks.js

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh Expo Snack links [skip ci]"
          git push
